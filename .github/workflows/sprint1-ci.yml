name: Sprint 1 CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate backend files
        run: |
          test -f backend/package.json || exit 1
          test -f backend/src/index.js || exit 1

      - name: Validate infrastructure files
        run: |
          test -f infrastructure/docker-compose.yml || exit 1
          test -f infrastructure/init.sql || exit 1

      - name: Validate environment variables
        run: |
          if [ -f backend/.env.example ]; then
            grep -q "AES_ENCRYPTION_KEY" backend/.env.example || echo "Warning: AES_ENCRYPTION_KEY missing"
            grep -q "ECC_PRIVATE_KEY" backend/.env.example || echo "Warning: ECC_PRIVATE_KEY missing"
            grep -q "ECC_PUBLIC_KEY" backend/.env.example || echo "Warning: ECC_PUBLIC_KEY missing"
          else
            echo "backend/.env.example not found"
            exit 1
          fi

      - name: Install dependencies
        run: |
          cd backend
          npm install --silent

      - name: Build Docker image
        run: docker build -t infrastructure-app:test backend/

      - name: Verify Docker image
        run: docker images | grep infrastructure-app

      - name: Run linter
        run: |
          cd backend
          if [ -f node_modules/.bin/eslint ]; then
            npm run lint || echo "Linting failed but continuing"
          else
            echo "No linter configured, skipping"
          fi

      - name: Run tests placeholder
        run: echo "Tests will be added in Sprint 2"

      - name: Success notification
        if: success()
        run: echo "Sprint 1 CI Pipeline completed successfully."

      - name: Failure notification
        if: failure()
        run: echo "Sprint 1 CI Pipeline failed. Check logs for details."