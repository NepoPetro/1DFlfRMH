name: Sprint 1 CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List project structure
        run: ls -la

      - name: Validate backend files
        run: |
          test -f backend/package.json || exit 1
          test -f backend/src/index.js || exit 1

      - name: Validate infrastructure files
        run: |
          test -f infrastructure/docker-compose.yml || exit 1
          test -f infrastructure/init.sql || exit 1

      - name: Build Docker image
        run: docker build -t infrastructure-app:test backend/

      - name: Verify Docker image
        run: docker images | grep infrastructure-app

      - name: Validate environment file template
        run: |
          if [ ! -f backend/.env.example ]; then
            cp backend/.env backend/.env.example
          fi
          test -f backend/.env.example || exit 1

      - name: Check environment variables
        run: |
          if [ -f backend/.env.example ]; then
            grep -q "AES_ENCRYPTION_KEY" backend/.env.example || echo "Warning: AES_ENCRYPTION_KEY not found"
            grep -q "ECC_PRIVATE_KEY" backend/.env.example || echo "Warning: ECC_PRIVATE_KEY not found"
            grep -q "ECC_PUBLIC_KEY" backend/.env.example || echo "Warning: ECC_PUBLIC_KEY not found"
          fi

      - name: Run tests placeholder
        run: echo "Test suite not implemented yet. Add tests in Sprint 2."

      - name: Success notification
        if: success()
        run: echo "Sprint 1 CI Pipeline completed successfully."

      - name: Failure notification
        if: failure()
        run: echo "Sprint 1 CI Pipeline failed. Check logs for details."