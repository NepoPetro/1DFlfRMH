name: Sprint 1 CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone https://github.com/NepoPetro/1DFlfRMH.git .
          git checkout ${{ github.sha }}

      - name: Build Docker image
        run: |
          docker build -t infrastructure-app:test backend/

      - name: Verify Docker image
        run: docker images | grep infrastructure-app

      - name: Validate infrastructure files
        run: |
          test -f infrastructure/docker-compose.yml || exit 1
          test -f infrastructure/init.sql || exit 1