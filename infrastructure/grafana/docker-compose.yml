version: '3.8'
services:
db:
image: postgres: 15
container_name: auth-db
environment:
POSTGRES_USER: postgres
POSTGRES_PASSWORD:  postgres
POSTGRES_DB: auth_db
ports:
 - "5432:5432"
volumes:
 - postgres_data:/var/lib/postgresql/postgres_data
healthcheck:
 tests: ["CMD-SHELL","pg_isready -U postgres"]
 interval: 10s
 timeout: 5s
 retries: 5

pgadmin:
 image: dpage/pgadmin4
 container_name: auth_pgadmin
 environment:
  PGADMIN_DEFAULT_EMAIL: admin@admin.com 
  PGADMIN_DEFAULT_PASSWORD: admin
 ports:
  -"5050:80"
 depends_on:
  db:
   condition: service_healthy


app:
 build:
  context: ../backend
  dockerfile: Dockerfile  
 container_name: auth-app
 enviroment:
  DB_HOST: db
  DB_USER: postgres
  DB_NAME: auth_db
  DB_PORT: 5432
  JWT_SECRET: supersecreto123
  PORT: 3000
 ports: 
  - "3000:3000"
 volumes:
  - ../backend:/app
 depends_on:
  db:
   condition: service_healthy
 command: npm run dev

volumes:
 postgres_data:
 